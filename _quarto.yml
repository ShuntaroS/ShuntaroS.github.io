project:
  type: website
  output-dir: _site
  pre-render:
    - ruby scripts/render_site_data.rb
  post-render:
    - scripts/post_render.sh
  render:
    - "*.qmd"
    - "en/*.qmd"

website:
  title: "佐藤 俊太朗 / Shuntaro Sato"
  site-url: "https://shuntaros.github.io/"
  description: "佐藤俊太朗の研究者ポートフォリオ。生物統計学、臨床疫学、研究デザイン、統計解析、臨床研究支援に関する活動を掲載しています。"
  google-analytics: "G-YCKBQZ7ZP8"
  navbar: false
  search: false

lang: ja
filters:
  - filters/site-layout.lua

format:
  html:
    theme:
      - default
      - styles.scss
    toc: false
    hide-description: true
    template-partials:
      - templates/title-block.html
    grid:
      body-width: 740px
      margin-width: 0px
      sidebar-width: 0px
      gutter-width: 24px
    anchor-sections: true
    smooth-scroll: false
    link-external-newwindow: false
    html-math-method: plain

execute:
  freeze: auto
