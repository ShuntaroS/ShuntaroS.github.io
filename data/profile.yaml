en:
  name: "Shuntaro Sato"
  ruby: "佐藤 俊太朗"
  affiliation: "Clinical Research Center, Nagasaki University Hospital"
  position: "Lecturer"
  summary: "My expertise lies in biostatistics and epidemiology. I focus on developing user-friendly statistical indicators and methods, designing clinical trials and observational studies, conducting statistical analysis, providing research consultations, and conducting educational activities."
  degrees:
    - "Ph.D. in Medical Biostatistics"
    - "M.Sc. in Environmental Science"
    - "B.Sc. in Environmental Science"
  fields:
    - title: "Biostatistics and Epidemiology"
      body: "Development of user-friendly metrics and methodologies for statistical practitioners. Research design, statistical analysis, and interpretation of results in clinical studies."
    - title: "Education"
      body: "Instruction for healthcare professionals and students pursuing careers in medicine and biostatistics."
    - title: "Clinical Research Support"
      body: "Collaborative work with researchers on study design development, analytical strategy consultation, statistical analysis, and manuscript peer review."
  memberships:
    - "The Biometric Society of Japan"
    - "Japan Epidemiological Association"
    - "Japan Society for Clinical Epidemiology"
    - "Japanese Society of Clinical Trials and Research"
    - "Japanese Circulation Society"
  education:
    - period: "Mar 2006"
      title: "Miyakonojo National College of Technology, Department of Electrical Engineering"
    - period: "Apr 2006"
      title: "Nagasaki University, Faculty of Environmental Studies"
    - period: "Mar 2008"
      title: "Nagasaki University, Department of Environmental Studies"
    - period: "Apr 2008 - Mar 2010"
      title: "Graduate School of Science and Technology, Nagasaki University"
    - period: "Apr 2015 - Oct 2018"
      title: "Graduate School of Medicine, Kurume University, Biostatistics"
  career:
    - period: "Apr 2010 - Mar 2014"
      title: "Private company, data management and statistical analysis department"
    - period: "Mar 2014 - Oct 2023"
      title: "Assistant Professor, Clinical Research Center, Nagasaki University Hospital"
    - period: "Nov 2023 - Present"
      title: "Lecturer, Clinical Research Center, Nagasaki University Hospital"
  teaching:
    - period: "Nagasaki University School of Medicine"
      title: "Medical Statistics"
    - period: "Nagasaki University School of Dentistry"
      title: "Medical Statistics"
    - period: "Nagasaki University School of Pharmaceutical Sciences"
      title: "Drug Evaluation"
    - period: "Nagasaki University Graduate School of Biomedical Sciences"
      title: "Advanced Clinical Trials"
